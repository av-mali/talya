<!-- ═══════ ANA SAYFA İÇERİĞİ (SPA modu) ═══════
     Sadece dash-wrap kısmı — çerçeve (topbar+sidebar) artık
     dashboard-shell.html'de, bir kez yükleniyor. -->
<div class="home-body">
  <div id="home-greeting" style="width:100%;max-width:920px;margin:0 auto 10px;font-size:13px;color:var(--t2);"></div>

  <div class="dash-wrap" style="margin-top:0;">
    <div class="dash-card" style="margin-bottom:14px;padding:18px 20px;background:linear-gradient(135deg, var(--card), var(--gold-lo));">
      <div style="display:flex;align-items:center;gap:10px;">
        <i class="fa-solid fa-scale-balanced" style="color:var(--gold);font-size:18px;"></i>
        <input type="text" id="talya-ask-input" placeholder="Talya'ya sorun…" style="flex:1;border:none;background:transparent;font-size:15px;outline:none;color:var(--t0);" onkeydown="if(event.key==='Enter')talyaAskSubmit()">
        <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--gold);font-size:15px;animation:breathe 2s infinite;margin-right:2px;"></i>
        <button class="pop-cta-btn g" style="width:auto;padding:9px 18px;" onclick="talyaAskSubmit()"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-head"><div class="dash-title"><i class="fa-solid fa-hourglass-half"></i> Yaklaşan Süreler</div><div class="dash-link" onclick="openDeadlinesModal()">Tümünü gör →</div></div>
        <div id="dashDeadlines"></div>
      </div>
      <div class="dash-card" style="background:var(--accent-bg);">
        <div class="dash-head"><div class="dash-title"><i class="fa-solid fa-list-check"></i> Günlük Özet</div></div>
        <div id="dashOzet"></div>
      </div>
    </div>

    <div class="dash-card" id="gelirGiderOzetCard" style="margin-top:14px;background:#FCFCFD;">
      <div class="dash-head"><div class="dash-title"><i class="fa-solid fa-chart-simple"></i> İstatistikler</div></div>
      <div id="ggOzetBox">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
      </div>
    </div>

    <div id="widget-hizliErisim" class="dash-card" style="margin-top:14px;display:none;background:var(--accent-bg);">
      <div class="dash-head"><div class="dash-title"><i class="fa-solid fa-bolt"></i> Hızlı Erişim</div></div>
      <div id="widget-hizliErisim-box" style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding-top:6px;"></div>
    </div>
  </div>
</div>

<!-- ═══════ YAKLAŞAN SÜRELER POPUP ═══════ -->
<div id="deadlinesScrim" onclick="if(event.target===this)closeDeadlinesModal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:14px;width:520px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);">
      <div class="serif" style="font-size:19px;"><i class="fa-solid fa-hourglass-half" style="color:var(--gold);margin-right:8px;"></i>Yaklaşan Süreler</div>
      <div style="cursor:pointer;color:var(--t3);font-size:18px;" onclick="closeDeadlinesModal()"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div id="deadlinesModalList" style="padding:16px 22px;overflow-y:auto;flex:1;"></div>
  </div>
</div>
